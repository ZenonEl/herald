[platforms.telegram]
type = "telegram"
token_file = "~/.config/herald/telegram.token"

[files]
allowed_roots = ["~/Herald/outbox"]
max_bytes = 50000000

# Optional Markdown overrides. Relative paths resolve beside this config file.
# Missing individual files fall back to the packaged defaults.
[prompts]
# directory = "prompts"

[routes.example]
platform = "telegram"
chat_id = "-1001234567890"
topic_id = 42

[projects.example]
# style_file = "styles/example.md"  # replaces the global writing style for this project
label = "Example project"
description = "Use for messages about the example project."
route = "example"

# Capture: log work chats into a local buffer the assistant can read.
# The bot must be a member with privacy mode disabled; membership alone is not
# consent - only chats listed here are stored.
[capture]
enabled = false
ttl_days = 7
capture_self = true
download_media = true
max_download_bytes = 20000000
# database = "~/.local/share/herald/inbox.db"
# files_dir = "~/.local/share/herald/files"
# self_id = 0            # required only when capture_self = false

[[capture.chats]]
id = -1001234567890
topic_id = 42             # optional: capture only this forum topic
slug = "example"
project = "example"       # lets project-scoped inbox reads avoid other projects

# Watch beta: route private messages from one trusted owner to already-open AI
# sessions. The same herald-capture process polls Telegram for Capture and Watch.
[watch]
enabled = false
allow_inspect_all = false  # normal sessions can inspect only their own deliveries

[watch.sources.owner_dm]
chat_id = 123456789        # private chat with the bot
user_id = 123456789        # only this Telegram account may issue commands

[watch.profiles.example]
tags = ["example", "101"] # send "#example text" or "#101 text" to the bot
source = "owner_dm"
project = "example"
response_format = "brief"
reply_context = "native_or_quote"
# reply_route = "example" # optional; project route is used by default
# instructions = "Reply with the result or the one question blocking it."
